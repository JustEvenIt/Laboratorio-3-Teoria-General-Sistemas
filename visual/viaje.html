<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viaje de los bloques</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1120px,100% - 32px);margin:64px auto 96px}

.viaje-controles{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 6px;font:12px/1.3 system-ui,sans-serif}
.viaje-caminos{display:flex;gap:6px;flex-wrap:wrap}
.viaje-controles button{font:inherit;border:1px solid var(--anatomy-lo);background:var(--anatomy-face);color:var(--anatomy-hi);border-radius:6px;padding:4px 10px;cursor:pointer}
.viaje-controles button[aria-pressed="true"]{border-color:var(--anatomy-hi);font-weight:600}
.viaje-botones{display:flex;gap:4px}
[data-carril] circle{stroke-width:.5}
[data-carril] circle[data-bien]{fill:var(--anatomy-hi);stroke:var(--anatomy-face)}
[data-carril] circle[data-mal]{fill:#d1242f;stroke:var(--anatomy-face)}
[data-part="pulso"]{fill:var(--anatomy-hi)}
[data-part="pulso"][data-ack]{fill:#1a7f37}
[data-part="pulso"][data-nack]{fill:#d1242f}
[data-lampara] .iso-side,[data-lampara] .iso-top{transition:fill .25s}
[data-lampara][data-on="ack"] path:not(.iso-line){fill:#2da44e}
[data-lampara][data-on="nack"] path:not(.iso-line){fill:#e5534b}
[data-cabeza][data-activa] path:not(.iso-line){fill:var(--anatomy-hi)}
[data-cable][data-activo] .iso-line{stroke:var(--anatomy-hi)}
.iso-page{margin:8px auto 8px}
.pantalla-fondo{fill:#161b20;stroke:#59636e;stroke-width:.5}
.pantalla-texto{white-space:pre;fill:#d6dde4;font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;letter-spacing:.02em}
.pantalla-texto[data-pantalla^="titulo"],.pantalla-texto[data-pantalla^="cuenta"]{fill:#9aa6b2}
.pantalla-flecha{fill:none;stroke:#6e7a86;stroke-width:.6;stroke-linecap:round;stroke-linejoin:round}
.celda{fill:#3a434c;transition:fill .15s}
.celda[data-bit="1"]{fill:#e6edf3}
.celda[data-bit="0"]{fill:#3d4650}
.celda[data-vacio]{fill:#22292f}
.celda[data-mal]{fill:#ff5d5d}
[data-part="led"]{fill:#2da44e}
.pozo{fill:var(--anatomy-faint)}
.casilla-zona{fill:transparent;cursor:pointer}
[data-casilla]{cursor:pointer}
[data-casilla]:hover .pozo{fill:var(--anatomy-lo)}
[data-estado="ok"]{--anatomy-face:#2da44e;--anatomy-lit-top:#6fd08c;--anatomy-lit-shade:#1d7a38}
[data-estado="rec"]{--anatomy-face:#d29922;--anatomy-lit-top:#f2c45a;--anatomy-lit-shade:#9a6c0c}
[data-estado="mal"]{--anatomy-face:#d1242f;--anatomy-lit-top:#f07178;--anatomy-lit-shade:#9c1a22}

-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Tablero (atrás, derecha): un pozo por paquete, una ficha por envío. Verde: llegó al primer envío. Ámbar: se recuperó repitiéndolo. Rojo: falló. Clic en un pozo para ver ese paquete</span></span><span class="iso-caption"><span data-pie></span></span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };

    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

};
function pathOf(points, closed = false) {

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

        const dy = by - ay;

    for (const run of runsOf(facing, true)) {

        if (height > 0)

    }

        for (let index = 0; index < count; index++) {

        fill = pathOf(convexHull([...top, ...bottom]), true);

        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {

            const next = (index + 1) % count;

        fill = parts.join("");

    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];

            const [nx, ny] = normals[index];

      f("reaparece", 0.35, { j });
    }
    f("codigo", 0.65, { j }); f("mover", 0.4, { de: ST.codigo, a: ST.modular }); f("modular", 0.55, { j });
    f("mover", 0.35, { de: ST.modular, a: ST.repartir, entra: true }); f("aire", 1.7, { j });
    f("combinar", 0.35, { j }); f("mover", 0.4, { de: ST.combinar, a: ST.decodificar }); f("decodificar", 0.75, { j });
    f("mover", 0.4, { de: ST.decodificar, a: ST.revisar }); f("revisar", 0.55, { j }); f("respuesta", 0.9, { j });
    if (e.ok || j === t.envios.length - 1) {
      f("mover", 0.4, { de: ST.revisar, a: ST.descifrar }); f("descifrar", 0.5, { j });
      f("mover", 0.55, { de: ST.descifrar, a: ST.salida - 6, sale: true }); f("pausa", 0.35, { j });

}

const suave = (u) => u * u * (3 - 2 * u);
const ponerCartucho = (x, opacidad) => {
  cartucho.setAttribute("transform", translateAlong(P, [x, 0, 0]));
  cartucho.style.opacity = String(opacidad);
};
const largoParidad = (t) => {
  const c = datosCamino();
  if (c.clave === "sin") return 0;
  return Math.max(2, Math.min(30, C.CART.w * (1 / Math.max(0.05, t.tasa) - 1)));
};
// La paridad que agrega el código se dibuja detrás del cartucho (lado −x) con el largo que corresponde a la tasa
let ultimoLargo = -1;
const ponerParidad = (t, f, x) => {
  const largo = Math.round(largoParidad(t) * f * 2) / 2;
  if (largo !== ultimoLargo) {
    ultimoLargo = largo;
    paridad.innerHTML = largo >= 0.5
      ? solidSvg(slabOf({ x: -C.CART.w / 2 - largo, y: C.CART_Y - C.CART.d / 2 + 0.5, w: largo, d: C.CART.d - 1, r: 0.6 },
                        C.RAIL_H, C.CART.h - 1, P, 3, 0.3), { tone: "mid" })
      : "";
  }
  paridad.setAttribute("transform", translateAlong(P, [x, 0, 0]));
  paridad.style.opacity = cartucho.style.opacity;
};

function sello(el, u) {
  const baja = Math.sin(Math.PI * Math.min(1, u)) * 4;
  el.setAttribute("transform", translateAlong(P, [0, 0, -baja]));
}

function capasActivas(t) { return [...Array(t.capas)].map((_, i) => t.capa_inicial + i); }

function limpiarAire() {
  cuentas.forEach((fila) => fila.forEach((c) => { c.style.opacity = "0"; }));
  for (const lado of ["tx", "rx"]) {
    cab[lado].forEach((h) => h.removeAttribute("data-activa"));
    cab2[lado].forEach((h) => h.removeAttribute("data-activo"));
  }
}

function aire(t, e, j, u) {
  const activas = capasActivas(t);
  const bitsCapa = (t.simbolos / t.capas) * t.qm;
  for (let l = 0; l < 8; l++) {
    const on = activas.includes(l);
    for (const lado of ["tx", "rx"]) {
      cab[lado][l].toggleAttribute("data-activa", on);
      cab2[lado][l].toggleAttribute("data-activo", on);
    }
    if (!on) { cuentas[l].forEach((c) => { c.style.opacity = "0"; }); continue; }
    const i = l - t.capa_inicial;
    const p = j === 0 && t.errores_capa.length ? t.errores_capa[i] / bitsCapa : e.errores / (t.simbolos * t.qm);
    const malSimbolo = 1 - Math.pow(1 - Math.min(1, p), t.qm);  // al menos un bit errado en el símbolo
    const ruido = 1.2 + 7 * Math.min(1, p * 3);
    cuentas[l].forEach((c, n) => {
      const s = Math.max(0, Math.min(1, u * 1.55 - n * 0.09));
      const semilla = tb * 131 + j * 17 + l * 7 + n;
      const mal = azar(semilla) < malSimbolo;
      const dy = (azar(semilla + 0.3) * 2 - 1) * ruido * s, dz = (azar(semilla + 0.7) * 2 - 1) * ruido * 0.7 * s;
      const x = -C.MAST_X + 3 + s * (2 * C.MAST_X - 6);
      const [px, py] = iso([x, C.LANES[l] + dy, C.AIR_Z + dz], P);
      c.setAttribute("cx", px.toFixed(2));
      c.setAttribute("cy", py.toFixed(2));
      c.style.opacity = s > 0 && s < 1 ? "1" : "0";
      c.toggleAttribute("data-mal", mal && s > 0.45);
      c.toggleAttribute("data-bien", !(mal && s > 0.45));
    });
  }
}


// ---------------- Monitor de inspección: contenido del paquete actual
const pantalla = (n) => svg.querySelector(`[data-pantalla="${n}"]`);
const celdas = [0, 1, 2].map((g) => [...svg.querySelectorAll(`.celda[data-g="${g}"]`)].sort((a, b) => a.dataset.i - b.dataset.i));
const espaciar = (h) => (h || "").toUpperCase().match(/.{1,2}/g)?.join(" ") || "—";
const bitsDe = (h) => {
  if (!h) return null;
  const b = [];
  for (const c of h) { const v = parseInt(c, 16); for (let k = 3; k >= 0; k--) b.push((v >> k) & 1); }
  return b;
};
const escribir = (n, txt) => { const el = pantalla(n); if (el && el.textContent !== txt) el.textContent = txt; };
// Pinta una cuadrícula: bits (o null = vacía); 'ref' marca en rojo los bits distintos; 'filas' cuántas filas se ven
function grilla(g, bits, ref, filas = 8) {
  let distintos = 0;
  celdas[g].forEach((c, i) => {
    const visible = bits && i < bits.length && Math.floor(i / 8) < filas;
    const mal = visible && ref && ref[i] !== bits[i];
    if (mal) distintos++;
    if (!visible) { c.setAttribute("data-vacio", ""); c.removeAttribute("data-bit"); c.removeAttribute("data-mal"); return; }
    c.removeAttribute("data-vacio");
    c.setAttribute("data-bit", String(bits[i]));
    c.toggleAttribute("data-mal", !!mal);
  });
  return distintos;
}
const MOD_TXT = (t) => `${MOD[t.qm] || ""} · R ${t.tasa.toFixed(3)}`;

function monitor(t, fase, u, idx) {
  const j = fase.j ?? 0, e = t.envios[Math.min(j, t.envios.length - 1)];
  const n = datosCamino().traza.length;
  const hecho = (tipo) => fases.slice(0, idx).some((f) => f.tipo === tipo && (f.j ?? 0) === j);
  const revisado = hecho("revisar") || (fase.tipo === "revisar" && u > 0.3);
  escribir("estado", `PAQUETE ${tb + 1} DE ${n} · ENVÍO ${j + 1} DE ${t.envios.length}` +
                     (revisado ? ` · CRC ${e.ok ? "CORRECTO" : "INCORRECTO"}` : ""));
  escribir("claro", `COMPRIMIDO ${espaciar(t.claro)}`);
  escribir("cifrado", DATOS.cifrado ? `CIFRADO    ${espaciar(t.info)}` : "SIN CIFRAR: IGUAL AL COMPRIMIDO");
  escribir("crc", `CRC ${(t.crc || "").toUpperCase()}`);
  escribir("modulacion", MOD_TXT(t));
  const mensaje = bitsDe(t.info), tx = bitsDe(e.tx), rx = bitsDe(e.rx), dec = bitsDe(e.dec);
  // Mensaje: siempre; aire: lo que sale y, al cruzar, cómo llega; corregido: al decodificar
  grilla(0, mensaje, null);
  escribir("cuenta0", mensaje ? `${mensaje.length} BITS` : "SIN DATOS");
  let aire = 0, filasAire = 0, verAire = tx;
  if (fase.tipo === "aire") { filasAire = Math.ceil(8 * Math.min(1, u * 1.25)); verAire = rx; }
  else if (hecho("aire")) { filasAire = 8; verAire = rx; }
  if (verAire === rx && rx) {
    aire = grilla(1, rx, tx, filasAire);
    escribir("cuenta1", filasAire >= 8 ? `${aire} CAMBIARON` : "…");
  } else {
    grilla(1, tx, null);
    escribir("cuenta1", tx ? "SALEN" : "SIN DATOS");
  }
  let filasDec = 0;
  if (fase.tipo === "decodificar") filasDec = Math.ceil(8 * Math.min(1, u * 1.25));
  else if (hecho("decodificar")) filasDec = 8;
  if (filasDec && dec) {
    const malos = grilla(2, dec, mensaje, filasDec);
    escribir("cuenta2", filasDec >= 8 ? `${malos} ERRADOS` : "…");
  } else {
    grilla(2, null, null);
    escribir("cuenta2", "");
  }
}

// ---------------- Tablero: una ficha por envío en el pozo de cada paquete
const POZOS = C.POZOS;
const marca = parte("marca");
const fichas = [...svg.querySelectorAll("[data-ficha]")].sort((a, b) => a.dataset.ficha - b.dataset.ficha);
const casillas = [...svg.querySelectorAll("[data-casilla]")].sort((a, b) => a.dataset.casilla - b.dataset.casilla);
const estadoFicha = [];
function estadoDe(t) { return !t.ok ? "mal" : t.envios.length > 1 ? "rec" : "ok"; }
function ponerFicha(i, t) {
  const clave = t ? `${estadoDe(t)}${t.envios.length}` : "";
  if (estadoFicha[i] === clave) return;
  estadoFicha[i] = clave;
  const g = fichas[i];
  if (!t) { g.innerHTML = ""; g.removeAttribute("data-estado"); return; }
  const [x, y] = POZOS[i];
  let html = "";
  for (let k = 0; k < t.envios.length; k++)
    html += solidSvg(cylinder(x, y, 3.7, C.TAB_H + k * 2, 1.7, P, 20, 0.3), { tone: "hi", lit: true });
  g.innerHTML = html;
  g.setAttribute("data-estado", estadoDe(t));
}
function tablero(c, fase) {
  const llegado = fase.tipo === "pausa";
  for (let i = 0; i < POZOS.length; i++) {
    const t = c.traza[i];
    const visible = t && (i < tb || (i === tb && llegado));
    ponerFicha(i, visible ? t : null);
    const titulo = casillas[i] && casillas[i].querySelector("title");
    const txt = !t ? `Pozo ${i + 1}: sin paquete` :
      `Paquete ${i + 1}: ${t.ok ? (t.envios.length > 1 ? `recuperado con ${t.envios.length} envíos` : "llegó al primer envío") : `falló después de ${t.envios.length} envíos`} · ${t.latencia_ms.toFixed(3)} ms`;
    if (titulo && titulo.textContent !== txt) titulo.textContent = txt;
  }
  const [x, y] = POZOS[Math.min(tb, POZOS.length - 1)];
  const d = ring(x, y, 6.6, C.TAB_H + 0.05, P, 28);
  if (marca.getAttribute("d") !== d) marca.setAttribute("d", d);
}

const RUTA = C.harq;
const largoRuta = RUTA.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - RUTA[i][0], p[1] - RUTA[i][1], p[2] - RUTA[i][2]), 0);
function puntoRuta(u) {
  let falta = u * largoRuta;
  for (let i = 1; i < RUTA.length; i++) {
    const a = RUTA[i - 1], b = RUTA[i], l = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (falta <= l) { const f = falta / l; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
    falta -= l;
  }
  return RUTA[RUTA.length - 1];
}

function texto(fase, t, e) {
  const c = datosCamino(), R = t.tasa.toFixed(3);
  const capas = t.capas === 1 ? `la capa ${t.capa_inicial + 1}` : `las capas ${t.capa_inicial + 1} a ${t.capa_inicial + t.capas}`;
  const env = fase.j > 0 ? ` (envío ${fase.j + 1})` : "";
  switch (fase.tipo) {
    case "sale": return `1 · sale del archivo comprimido: ${fmt(t.bits)} bits`;
    case "aes": return DATOS.cifrado ? "2 · se cifra con AES-128 (modo contador)" : "2 · sin cifrar";
    case "crc": return `3 · se agrega el CRC ${t.crc}`;
    case "reaparece": return `NACK recibido: el transmisor saca el paquete de su buffer${env}`;
    case "codigo":
      if (fase.j > 0) return c.clave === "ldpc" ? `4 · LDPC: otra versión de redundancia, rv = ${e.rv}${env}` : `4 · se repite la misma palabra${env}`;
      return c.clave === "ldpc" ? `4 · LDPC de 5G: tasa ${R}` : c.clave === "sin" ? "4 · sin código: sólo el CRC" : `4 · ${c.nombre}: tasa ${R}`;
    case "modular": return `5 · ${MOD[t.qm]}: ${t.qm} bits por símbolo → ${fmt(t.simbolos)} símbolos${env}`;
    case "aire": return `aire · ${capas} · ${DATOS.snr_capa_db.toFixed(1)} dB por capa · ${fmt(e.errores)} bits errados`;
    case "combinar": return `7 · se juntan los símbolos de ${capas}`;
    case "decodificar":
      if (c.clave === "ldpc") return `8 · LDPC: ${fmt(e.iteraciones)} iteraciones (${(e.iteraciones / Math.max(1, t.bloques_codigo)).toFixed(1)} por parte)${env}`;
      return c.clave === "sin" ? `8 · se decide cada bit${env}` : `8 · síndrome y líder de clase${env}`;
    case "revisar": return e.ok ? "9 · CRC correcto → ACK" : "9 · CRC incorrecto → NACK";
    case "respuesta": return e.ok ? "ACK: el transmisor pasa al paquete siguiente" : (fase.j < t.envios.length - 1 ? "NACK: el transmisor lo envía otra vez" : "NACK y no quedan envíos: se entrega con errores");
    case "espera": return "el receptor guarda lo recibido para combinarlo con el próximo envío";
    case "descifrar": return DATOS.cifrado ? "10 · se descifra (el mismo AES en modo contador)" : "10 · sin cifrar";
    case "pausa": return `11 · ${t.ok ? "llegó bien" : "llegó con errores"} · ${t.latencia_ms.toFixed(3)} ms`;
    default: return null;
  }
}

function dibujar() {
  const c = datosCamino(), t = c.traza[tb];
  if (!t) return;
  // Fase actual
  let acumulado = 0, fase = fases[fases.length - 1], u = 1, idx = fases.length - 1;
  for (let i = 0; i < fases.length; i++) {
    if (reloj < acumulado + fases[i].dur) { fase = fases[i]; u = (reloj - acumulado) / fases[i].dur; idx = i; break; }
    acumulado += fases[i].dur;
  }
  const j = fase.j ?? 0, e = t.envios[Math.min(j, t.envios.length - 1)];
  // Estado de fondo según lo que ya pasó en este bloque
  const paso = (tipo, desde = 0) => fases.slice(0, idx).some((f) => f.tipo === tipo && (f.j ?? 0) >= desde);
  const cifrado = DATOS.cifrado && (paso("aes") || fase.tipo === "aes" && u > 0.5) && !(paso("descifrar") || fase.tipo === "descifrar" && u > 0.5);
  franja.style.opacity = cifrado ? "1" : "0";
  etiqueta.style.opacity = (paso("crc") || fase.tipo === "crc" && u > 0.5) && !(fase.tipo === "descifrar" || paso("descifrar") || fase.tipo === "pausa") ? "1" : "0";
  for (const s of Object.values(sellos)) s.setAttribute("transform", "");
  limpiarAire();
  lampara.ack.removeAttribute("data-on");
  lampara.nack.removeAttribute("data-on");
  pulso.style.opacity = "0";

  let x = ST.tolva + 6, op = 1;
  if (fase.tipo === "mover") {
    x = fase.de + (fase.a - fase.de) * suave(u);
    if (fase.entra) op = 1 - Math.max(0, (u - 0.7) / 0.3);
    if (fase.sale) op = 1 - Math.max(0, (u - 0.75) / 0.25);
  } else {
    x = { sale: ST.tolva + 6, aes: ST.aes, crc: ST.crc, reaparece: ST.codigo, codigo: ST.codigo, modular: ST.modular, aire: ST.repartir,
          combinar: ST.combinar, decodificar: ST.decodificar, revisar: ST.revisar, respuesta: ST.revisar, espera: ST.revisar,
          descifrar: ST.descifrar, pausa: ST.salida - 6 }[fase.tipo];
    if (fase.tipo === "sale") op = suave(u);
    if (fase.tipo === "reaparece") op = suave(u);
    if (fase.tipo === "aire") op = 0;
    if (fase.tipo === "combinar") op = suave(u);
    if (fase.tipo === "espera") op = 1 - suave(u);
    if (fase.tipo === "pausa") op = 0;
  }
  // Paridad: crece en el código (4) y se quita al decodificar (8), en cada envío
  let par;
  if (fase.tipo === "codigo") par = suave(u);
  else if (fase.tipo === "decodificar") par = 1 - suave(u);
  else par = paso("codigo", j) && !paso("decodificar", j) ? 1 : 0;
  ponerCartucho(x, op);
  ponerParidad(t, par, x);

  if (fase.tipo === "aes" && DATOS.cifrado) sello(sellos.aes, u);
  if (fase.tipo === "crc") sello(sellos.crc, u);
  if (fase.tipo === "descifrar" && DATOS.cifrado) sello(sellos.des, u);
  aguja(agujas.qam, ...DIAL.qam, (t.qm - 2) / 8 * (fase.tipo === "modular" ? suave(u) : 1));
  const iterFrac = c.clave === "ldpc" ? e.iteraciones / Math.max(1, t.bloques_codigo) / 25 : 0;
  aguja(agujas.iter, ...DIAL.iter, fase.tipo === "decodificar" ? iterFrac * suave(u) : (paso("decodificar", j) ? iterFrac : 0));
  aguja(agujas.snr, ...DIAL.snr, (DATOS.snr_capa_db + 10) / 50);
  if (fase.tipo === "aire") aire(t, e, j, u);
  if (fase.tipo === "revisar" || fase.tipo === "respuesta") lampara[e.ok ? "ack" : "nack"].setAttribute("data-on", e.ok ? "ack" : "nack");
  if (fase.tipo === "respuesta") {
    const [px, py] = iso(puntoRuta(suave(u)), P);
    pulso.setAttribute("cx", px.toFixed(2));
    pulso.setAttribute("cy", py.toFixed(2));
    pulso.style.opacity = "1";
    pulso.toggleAttribute("data-ack", e.ok);
    pulso.toggleAttribute("data-nack", !e.ok);
  }
  // Tejas: lo que falta por enviar (izquierda) y lo recuperado (derecha), entre los bloques que se muestran
  const n = c.traza.length, entregados = tb + (fase.tipo === "pausa" ? 1 : 0);
  tejas.tx.forEach((g, i) => { g.style.opacity = i < Math.ceil(10 * (n - tb) / n) ? "1" : "0"; });
  tejas.rx.forEach((g, i) => { g.style.opacity = i < Math.floor(10 * entregados / n) ? "1" : "0"; });

  monitor(t, fase, u, idx);
  tablero(c, fase);
  const linea = texto(fase.tipo === "mover" ? (fases[idx + 1] || fase) : fase, t, e);
  const lectura = `Paquete ${tb + 1} de ${n}` + (t.envios.length > 1 ? ` · ${t.envios.length} envíos` : "") + (linea ? ` · ${linea}` : "");
  if (readout.textContent !== lectura) readout.textContent = lectura;
}

function resumen() {
  const c = datosCamino();
  const palabras = DATOS.palabras > 1 ? `, ${DATOS.palabras} paquetes a la vez (uno por cada ${DATOS.capas_palabra} capas)` : "";
  pie.textContent = `${DATOS.escenario} · ${c.nombre}: ${fmt(c.bloques)} paquetes, ${fmt(c.envios)} envíos, ${fmt(c.fallidos)} con errores al final. ` +
    `${DATOS.capas} capa${DATOS.capas > 1 ? "s" : ""} MIMO${palabras}; con SNR ${DATOS.snr_db.toFixed(1)} dB cada capa llega con ` +
    `${DATOS.snr_capa_db.toFixed(1)} dB porque la potencia se reparte entre ellas. Se muestran los primeros ${c.traza.length} paquetes (bloques de transporte), con sus números reales.`;
}

function irA(n) {
  const total = datosCamino().traza.length;
  tb = (n + total) % total;
  reloj = 0;
  armarFases();
  dibujar();
  correr();
}

function tick(ahora) {
  const dt = ultimo ? Math.min((ahora - ultimo) / 1000, 1 / 20) : 0;
  ultimo = ahora;
  if (!pausa) {
    reloj += dt;
    const total = fases.reduce((s, f) => s + f.dur, 0);
    if (reloj >= total) { irA(tb + 1); return; }
  }
  dibujar();
  cuadro = visible && !pausa ? requestAnimationFrame(tick) : 0;
}
function correr() { if (!cuadro && visible && !pausa) { ultimo = 0; cuadro = requestAnimationFrame(tick); } }

// Controles
svg.addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-casilla]");
  if (!g) return;
  const i = Number(g.dataset.casilla);
  if (i < datosCamino().traza.length) irA(i);
});
const caja = document.querySelector("[data-caminos]");
DATOS.caminos.forEach((c, i) => {
  const b = document.createElement("button");
  b.textContent = c.nombre;
  b.setAttribute("aria-pressed", String(i === 0));
  b.addEventListener("click", () => {
    camino = i;
    caja.querySelectorAll("button").forEach((x, n) => x.setAttribute("aria-pressed", String(n === i)));
    resumen();
    colorear();
    irA(0);
  });
  caja.appendChild(b);
});
const botonPausa = document.querySelector('[data-accion="pausa"]');
const ponerPausa = (v) => { pausa = v; botonPausa.textContent = pausa ? "▶︎ seguir" : "❚❚"; if (!pausa) correr(); };
botonPausa.addEventListener("click", () => ponerPausa(!pausa));
document.querySelector('[data-accion="anterior"]').addEventListener("click", () => irA(tb - 1));
document.querySelector('[data-accion="siguiente"]').addEventListener("click", () => irA(tb + 1));
stage.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowRight") { ev.preventDefault(); irA(tb + 1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); irA(tb - 1); }
  else if (ev.key === " ") { ev.preventDefault(); ponerPausa(!pausa); }
});
